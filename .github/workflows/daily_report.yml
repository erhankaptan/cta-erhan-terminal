name: CTA Terminal - Daily Report

on:
  # DENETCI KARARI (2026-10-25): Otomatik `schedule:` tetikleyicisi
  # KALDIRILDI. Bu workflow, fetch.yml (saatlik + core/notification_
  # schedule.py zamanlama kapisi) ile AYNI anda/yakin zamanda tetiklenip
  # cifte Telegram+Email bildirimine sebep oluyordu. Artik SADECE manuel
  # (workflow_dispatch) calisir -- butun otomatik bildirimler fetch.yml
  # uzerinden gidiyor.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Send Telegram + Email report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_report.py