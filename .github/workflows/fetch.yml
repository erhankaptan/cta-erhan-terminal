name: CTA Terminal - Nitter Fetch

on:
  # Her 3 saatte 1 çalış (17. dakikada — yoğunluktan kaçınmak için)
  schedule:
    - cron: '17 */3 * * *'
  
  # Manuel tetikleme (test için)
  workflow_dispatch:

# Repo'ya yazma izni
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Repo'yu çek
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Python kur
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Bağımlılıkları kur
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Nitter fetch script'ini çalıştır
      - name: Fetch tweets from Nitter
        run: python scripts/fetch_nitter.py

      # 5. Gemini ile analiz et
            - name: Analyze tweets with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/analyze_tweets.py

      # 5.5. RSS çek (Tickmill)
      - name: Fetch RSS from Tickmill
        run: python scripts/fetch_rss.py

      # 5.6. RSS çevir (Türkçe)
      - name: Translate RSS to Turkish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/translate_rss.py

      # 6. Evidence DB'ye ekle

      # 6. Değişiklikleri commit et
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "CTA Terminal Bot"
          git add data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor"
          else
            git commit -m "Auto: Fetch + analyze tweets $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
