name: CTA Terminal - Auto Pipeline

on:
  # DENETCI KARARI (2026-10-25): Saatlik tetikleme (GitHub Actions
  # kotasini asiri tuketmemek icin cok sik degil, 15 dk degil).
  # Gercek bildirim GONDERME karari artik burada DEGIL --
  # scripts/send_report.py icindeki core/notification_schedule.py
  # (zoneinfo.ZoneInfo("Europe/Paris")) tarafindan veriliyor: sadece
  # hafta ici 15:00/18:30/21:30 (+-7 dk) penceresinde gercekten
  # gonderiliyor, digerlerinde script sessizce atlar. Boylece DST
  # (yaz/kis saati) icin cron'u yilda 2 kez elle degistirmeye gerek
  # kalmiyor -- veri toplama/sentez pipeline'i ise HER saat calisir
  # (veri tazeligi icin).
  schedule:
    - cron: '0 * * * *'

  # Manuel tetikleme (test etmek için)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Toplam akış süresi 30 dk ile sınırlandı

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Nitter çekim adımı (Maksimum 8 dakika)
      - name: Fetch tweets from Nitter
        timeout-minutes: 8
        continue-on-error: true
        run: python scripts/fetch_nitter.py

      # Gemini Tweet Analizi (10 dk yerine hızlı 3 dk limit)
      - name: Analyze tweets with Gemini
        timeout-minutes: 3
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/analyze_tweets.py

      # RSS Çekim
      - name: Fetch RSS from Tickmill
        timeout-minutes: 2
        continue-on-error: true
        run: python scripts/fetch_rss.py

      # RSS Çeviri
      # DENETCI KARARI (2026-10-25): 3dk -> 10dk. Kok neden: 1 aylik
      # donma doneminde biriken 171 cevrilmemis ogeyi 3dk'da bitirmeye
      # calisiyordu (sadece sabit sleep'ler 513sn = 8.5dk tutuyordu,
      # API gecikmesi haric). Artik translate_rss.py'de MAX_ITEMS_PER_RUN
      # ile zaten batch'lere bolunuyor ama Gemini API gecikmesi de
      # (bazen yavaş) payi var -- 10dk daha gercekci bir tavan.
      - name: Translate RSS to Turkish
        timeout-minutes: 10
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/translate_rss.py

      # Kanıt Havuzunu İnşa Et
      - name: Build evidence pool
        run: python scripts/build_evidence_pool.py

      # Sentez (Taze snapshot.json / latest.json burada üretilir)
      - name: Run synthesis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_synthesis.py

      # Raporlama (Telegram & Email)
      - name: Send Report (Telegram & Email)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ENABLED: "true"
          EMAIL_SMTP_HOST: "smtp.gmail.com"
          EMAIL_SMTP_PORT: "587"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_report.py

      # Commit ve Push
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "CTA Terminal Bot"
          git add data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor"
          else
            git commit -m "Auto: Full pipeline $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
