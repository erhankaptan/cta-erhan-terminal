name: CTA Terminal - Auto Pipeline

on:
  # Fransa Saatiyle (UTC+2) seans içi her 3 saatte bir (09:00, 12:00, 15:00, 18:00, 21:00, 00:00)
  schedule:
    - cron: '0 7-22/3 * * *'

  # Manuel tetikleme (test etmek için)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Bot korumaları ve yavaş çekim için 60 dk ana limit kalıyor

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Nitter çekim adımına 15 dk limit + hata toleransı ekledik
      - name: Fetch tweets from Nitter
        timeout-minutes: 15
        continue-on-error: true
        run: python scripts/fetch_nitter.py

      - name: Analyze tweets with Gemini
        timeout-minutes: 5
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/analyze_tweets.py

      - name: Fetch RSS from Tickmill
        timeout-minutes: 3
        continue-on-error: true
        run: python scripts/fetch_rss.py

      - name: Translate RSS to Turkish
        timeout-minutes: 5
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/translate_rss.py

      - name: Build evidence pool
        run: python scripts/build_evidence_pool.py

      - name: Run synthesis
        run: python scripts/run_synthesis.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "CTA Terminal Bot"
          git add data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor"
          else
            git commit -m "Auto: Full pipeline $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
