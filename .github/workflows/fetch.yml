name: CTA Terminal - Auto Pipeline

on:
  # Her 3 saatte 1 çalış (17. dakikada — yoğunluktan kaçınmak için)
  schedule:
    - cron: '17 */3 * * *'

  # Manuel tetikleme (test için)
  workflow_dispatch:

# Repo'ya yazma izni
permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      # 1. Repo'yu çek
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Python kur
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Bağımlılıkları kur
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Nitter'dan tweet çek
      - name: Fetch tweets from Nitter
        run: python scripts/fetch_nitter.py

      # 5. Gemini ile tweet analizi
      - name: Analyze tweets with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/analyze_tweets.py

      # 6. RSS çek (Tickmill)
      - name: Fetch RSS from Tickmill
        run: python scripts/fetch_rss.py

      # 7. RSS çevir + yorum + varlık analizi
      - name: Translate RSS to Turkish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/translate_rss.py

      # 8. Evidence havuzunu inşa et
      - name: Build evidence pool
        run: python scripts/build_evidence_pool.py

      # 9. Sentez çalıştır (snapshot üret)
      - name: Run synthesis
        run: python scripts/run_synthesis.py

      # 10. Değişiklikleri commit et
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "CTA Terminal Bot"
          git add data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor"
          else
            git commit -m "Auto: Full pipeline $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi